<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudo Certo</title>
<meta name="theme-color" content="#046A38">
<style>
  :root{ --green:#046A38; --yellow:#FCD116; }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--green); color:#fff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    text-align:center; padding:24px;
  }
  .wrap{ max-width:420px; }
  h1{ font-size:1.8rem; margin:0 0 12px; }
  p{ opacity:.9; line-height:1.5; margin:0 0 28px; }
  a.btn{
    display:inline-block; background:var(--yellow); color:var(--green); font-weight:800;
    padding:14px 28px; border-radius:999px; text-decoration:none; font-size:1rem;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Estudo Certo</h1>
    <p>Acompanhamento de estudos para concursos: apostilas, questões, ciclo de estudos e metas.</p>
    <a class="btn" href="/app/">Abrir o app</a>
  </div>
</body>
</html>
